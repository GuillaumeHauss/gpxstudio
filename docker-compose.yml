version: '3.8'

services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - db-data:/usr/src/app
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
