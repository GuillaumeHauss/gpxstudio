version: '3.8'

services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - db-data:/usr/src/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: tester
    depends_on:
      - frontend
      - backend
    command: ["npm", "run", "test:e2e"]
    # Mount the test results directory to the host
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

volumes:
  db-data:
